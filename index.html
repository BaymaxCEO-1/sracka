<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vítej na mém webu!</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #a2d2ff, #efb0c9);
      color: #333;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 100vh;
    }

    header {
      padding: 40px 20px;
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.2em;
    }

    a.button {
      display: inline-block;
      margin-top: 30px;
      padding: 12px 25px;
      background-color: #007BFF;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      transition: background-color 0.3s ease;
    }

    a.button:hover {
      background-color: #0056b3;
    }

    footer {
      margin-top: auto;
      padding: 20px;
      font-size: 0.9em;
      background-color: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>
  <header>
    <h1>Vítej na mém webu</h1>
    <p>Toto je moje hlavní stránka hostovaná na GitHubu</p>
    <a class="button" href="https://www.vinted.cz" target="_blank">Navštiv Vinted</a>
  </header>

  <footer>
    &copy; 2025 Moje jméno | Všechna práva vyhrazena
  </footer>
</body>
</html>
</body>
</html>
